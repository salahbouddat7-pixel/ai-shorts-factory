
name: AI Shorts Factory

on:
  workflow_dispatch:

jobs:
  create-short:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          ffmpeg -version

      - name: Test video rendering
        run: |
          mkdir -p output
          ffmpeg -y \
            -f lavfi -i "color=c=black:s=1080x1920:r=30" \
            -f lavfi -i "sine=frequency=440:sample_rate=44100" \
            -t 5 \
            -c:v libx264 -preset ultrafast \
            -pix_fmt yuv420p \
            -c:a aac \
            -shortest output/test-short.mp4

      - name: Save video
        uses: actions/upload-artifact@v4
        with:
          name: test-short
          path: output/test-short.mp4
          retention-days: 3

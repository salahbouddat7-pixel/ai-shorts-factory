
name: AI Shorts Factory

on:
  workflow_dispatch:

jobs:
  create-short:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install video tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng
          python -m pip install pillow edge-tts

      - name: Generate AI video script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python generate_script.py

      - name: Generate narrated MP4
        run: python make_video.py

      - name: Upload finished video
        uses: actions/upload-artifact@v4
        with:
          name: finished-ai-short
          path: output/final_short.mp4
          retention-days: 7

      - name: Upload script
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-script
          path: output/script.json
          if-no-files-found: ignore
          retention-days: 7

name: Monkey Influencer Factory
on:
  workflow_dispatch:
  schedule:
    - cron: '17 16 * * *'
permissions:
  contents: read
jobs:
  create-short:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg espeak-ng fonts-dejavu-core
          python -m pip install pillow edge-tts
      - name: Write comedy script
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: python generate_script.py
      - name: Render monkey video
        run: python make_video.py
      - name: Upload MP4 and script
        uses: actions/upload-artifact@v4
        with:
          name: monkey-short-${{ github.run_number }}
          path: |
            output/final_short.mp4
            output/script.json
          retention-days: 7

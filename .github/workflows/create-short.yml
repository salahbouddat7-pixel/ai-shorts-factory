
name: AI Shorts Factory

on:
  workflow_dispatch:

jobs:
  create-short:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Generate AI video script
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python generate_script.py

      - name: Save generated script
        uses: actions/upload-artifact@v4
        with:
          name: ai-video-script
          path: output/script.json
          retention-days: 3
